# Example configuration for using AUX pins for RS422 direction control
# This shows how to configure a CUI AMT21x RS422 encoder with custom direction pins

# Configure UART for CUI AMT21x RS422 encoder
conf set aux1.uart.mode 4          # CUI AMT21x RS422 encoder
conf set aux1.uart.baud_rate 115200
conf set aux1.uart.rs422 1         # Enable RS422 transceiver

# Use AUX pins 3 and 4 for RS422 direction control instead of hardcoded pins
conf set aux1.uart.rs422_re_pin 3  # Use AUX pin 3 for receive enable
conf set aux1.uart.rs422_de_pin 4  # Use AUX pin 4 for drive enable

# Configure UART pins (pins 1 and 2 for RX/TX)
conf set aux1.pins.1.mode 8        # Set pin 1 to UART RX
conf set aux1.pins.2.mode 8        # Set pin 2 to UART TX

# Note: pins 3 and 4 will be automatically configured as digital outputs
# for RS422 direction control and should not be manually configured

# Configure the encoder as a position source
conf set motor_position.sources.0.type 2        # UART source
conf set motor_position.sources.0.aux_number 1  # Use aux1
